<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenziario Assegni</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { text-align: center; color: #2c3e50; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        label { font-size: 0.9em; font-weight: 600; margin-bottom: 4px; color: #555; }
        input, select, button { padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; }
        input:focus, select:focus { outline: none; border-color: #3498db; }
        .btn-primary { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-secondary { background-color: #ecf0f1; color: #333; border: 1px solid #bdc3c7; margin-top: 10px; cursor: pointer; }
        .month-group { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
        .month-header { background: #2c3e50; color: #fff; padding: 12px 15px; font-size: 1.1em; font-weight: bold; display: flex; justify-content: space-between; }
        .check-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; }
        .check-item:last-child { border-bottom: none; }
        .check-header { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .date-badge { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
        .bank-badge { background: #f1c40f; color: #333; padding: 3px 6px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
        .amount { font-size: 1.2em; font-weight: bold; color: #27ae60; }
        .details { font-size: 0.9em; color: #666; line-height: 1.4; }
        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 0.9em; margin-top: 10px; text-align: left; padding: 0; text-decoration: underline; }
        .total-row { padding: 15px; background: #fdfefe; text-align: right; font-weight: bold; font-size: 1.1em; border-top: 2px solid #eee; color: #2c3e50; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row .form-group { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gestione Assegni</h2>

    <!-- Form Inserimento -->
    <div class="card">
        <form id="checkForm">
            <div class="flex-row">
                <div class="form-group">
                    <label>Data Scadenza</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label>Importo (€)</label>
                    <input type="number" id="importo" step="0.01" min="0" placeholder="0.00" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Banca</label>
                <select id="banca" required></select>
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>Numero Assegno</label>
                    <input type="text" id="numeroAssegno" placeholder="Es. 123456789" required>
                </div>
            </div>

            <div class="form-group">
                <label>Beneficiario</label>
                <input type="text" id="beneficiario" placeholder="A favore di..." required>
            </div>

            <div class="form-group">
                <label>Causale</label>
                <input type="text" id="causale" placeholder="Fattura n... / Rata...">
            </div>

            <button type="submit" class="btn-primary">Aggiungi Assegno</button>
        </form>
        
        <button class="btn-secondary" onclick="aggiungiBanca()" style="width: 100%;">+ Aggiungi Nuova Banca</button>
    </div>

    <!-- Lista Scadenze -->
    <div id="scadenziario"></div>
</div>

<script>
    // Dati Iniziali e LocalStorage
    let banks = JSON.parse(localStorage.getItem('assegni_banks')) || ["Banca Popolare Pugliese", "Banca Popolare di Puglia e Basilicata"];
    let checks = JSON.parse(localStorage.getItem('assegni_data')) || [];

    const formatCurrency = (num) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(num);
    const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const getMonthYear = (dateStr) => {
        const d = new Date(dateStr);
        return d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
    };

    function init() {
        aggiornaSelectBanche();
        renderScadenziario();
    }

    function aggiornaSelectBanche() {
        const select = document.getElementById('banca');
        select.innerHTML = '';
        banks.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            select.appendChild(opt);
        });
    }

    function aggiungiBanca() {
        const nuova = prompt("Inserisci il nome della nuova Banca:");
        if (nuova && nuova.trim() !== "") {
            banks.push(nuova.trim());
            localStorage.setItem('assegni_banks', JSON.stringify(banks));
            aggiornaSelectBanche();
        }
    }

    document.getElementById('checkForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const check = {
            id: Date.now().toString(),
            data: document.getElementById('data').value,
            importo: parseFloat(document.getElementById('importo').value),
            banca: document.getElementById('banca').value,
            numero: document.getElementById('numeroAssegno').value,
            beneficiario: document.getElementById('beneficiario').value,
            causale: document.getElementById('causale').value
        };
        checks.push(check);
        saveAndRender();
        this.reset();
    });

    function eliminaAssegno(id) {
        if(confirm("Vuoi eliminare questo assegno?")) {
            checks = checks.filter(c => c.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('assegni_data', JSON.stringify(checks));
        renderScadenziario();
    }

    function renderScadenziario() {
        const container = document.getElementById('scadenziario');
        container.innerHTML = '';

        if (checks.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#777;">Nessun assegno inserito.</p>';
            return;
        }

        // Ordina per data crescente (cronologico)
        checks.sort((a, b) => new Date(a.data) - new Date(b.data));

        // Raggruppa per Mese-Anno
        const grouped = {};
        checks.forEach(c => {
            const my = getMonthYear(c.data);
            if (!grouped[my]) grouped[my] = [];
            grouped[my].push(c);
        });

        // Genera HTML
        for (const [month, items] of Object.entries(grouped)) {
            let html = `<div class="month-group">`;
            let totaleMese = 0;
            
            html += `<div class="month-header"><span>${month}</span></div>`;
            
            items.forEach(c => {
                totaleMese += c.importo;
                html += `
                <div class="check-item">
                    <div class="check-header">
                        <span class="date-badge">${formatDate(c.data)}</span>
                        <span class="amount">${formatCurrency(c.importo)}</span>
                    </div>
                    <div class="details">
                        <strong>N° Assegno:</strong> ${c.numero} <span class="bank-badge">${c.banca}</span><br>
                        <strong>A favore di:</strong> ${c.beneficiario}<br>
                        <strong>Causale:</strong> ${c.causale || 'N/A'}
                    </div>
                    <button class="delete-btn" onclick="eliminaAssegno('${c.id}')">Elimina</button>
                </div>`;
            });

            html += `<div class="total-row">Totale Mese: ${formatCurrency(totaleMese)}</div>`;
            html += `</div>`;
            container.innerHTML += html;
        }
    }

    init();
</script>
</body>
</html>

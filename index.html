    const formatCurrency = (num) => {
        let numStr = parseFloat(num).toFixed(2); 
        let parts = numStr.split('.'); 
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "."); 
        return parts.join(',') + ' €'; 
    };

    const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
    };

    const getMonthYearStr = (dateStr) => {
        const d = new Date(dateStr);
        return d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();

    function aggiornaSelectBanche() {
        const select = document.getElementById('banca');
        select.innerHTML = '';
        banks.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            select.appendChild(opt);
        });
    }

    function aggiungiBanca() {
        const nuova = prompt("Inserisci il nome della nuova Banca:");
        if (nuova && nuova.trim() !== "") {
            banks.push(nuova.trim());
            localStorage.setItem('assegni_banks', JSON.stringify(banks));
            aggiornaSelectBanche();
            renderScadenziario();
        }
    }

    document.getElementById('checkForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const check = {
            id: Date.now().toString(),
            data: document.getElementById('data').value,
            importo: parseFloat(document.getElementById('importo').value),
            banca: document.getElementById('banca').value,
            numero: document.getElementById('numeroAssegno').value,
            beneficiario: document.getElementById('beneficiario').value,
            causale: document.getElementById('causale').value
        };
        checks.push(check);
        saveAndRender();
        this.reset();
    });

    window.aggiornaCampo = function(id, campo, valore) {
        const check = checks.find(c => c.id === id);
        if (check) {
            if (campo === 'importo') {
                let numeroPulito = valore.replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
                check.importo = parseFloat(numeroPulito) || 0;
            } else {
                check[campo] = valore;
            }
            saveAndRender();
        }
    };

            checks = checks.filter(c => c.id !== id);

        localStorage.setItem('assegni_data', JSON.stringify(checks));

        }

        const totalsByMonth = {};
        const totalsByYear = {};
        const activeBanks = new Set();

        checks.forEach(c => {
            activeBanks.add(c.banca);
            const date = new Date(c.data);
            const year = date.getFullYear();
            const monthStr = getMonthYearStr(c.data);
            
            if (!totalsByMonth[monthStr]) totalsByMonth[monthStr] = { total: 0, dateObj: date, banks: {} };
            if (!totalsByMonth[monthStr].banks[c.banca]) totalsByMonth[monthStr].banks[c.banca] = 0;
            
            if (!totalsByYear[year]) totalsByYear[year] = { total: 0, banks: {} };
            if (!totalsByYear[year].banks[c.banca]) totalsByYear[year].banks[c.banca] = 0;

            totalsByMonth[monthStr].banks[c.banca] += c.importo;
            totalsByMonth[monthStr].total += c.importo;
            totalsByYear[year].banks[c.banca] += c.importo;
            totalsByYear[year].total += c.importo;
        });

        const bankList = Array.from(activeBanks).sort();
        let headersHtml = bankList.map(b => `<th>${b}</th>`).join('');

        let htmlMensile = `
            <h3>Situazione Mensile</h3>
            <table class="summary-table">
                <thead><tr><th>Mese</th>${headersHtml}<th class="total-col">Totale Mese</th></tr></thead>
                <tbody>`;
        
        const sortedMonths = Object.keys(totalsByMonth).sort((a, b) => totalsByMonth[a].dateObj - totalsByMonth[b].dateObj);
        
        sortedMonths.forEach(month => {
            htmlMensile += `<tr><td>${month}</td>`;
            bankList.forEach(b => {
                const val = totalsByMonth[month].banks[b] || 0;
                htmlMensile += `<td>${val > 0 ? formatCurrency(val) : '-'}</td>`;
            });
            htmlMensile += `<td class="total-col">${formatCurrency(totalsByMonth[month].total)}</td></tr>`;
        });
        htmlMensile += `</tbody></table>`;

        let htmlAnnuale = `
            <h3>Situazione Annuale</h3>
            <table class="summary-table">
                <thead><tr><th>Anno</th>${headersHtml}<th class="total-col">Totale Anno</th></tr></thead>
                <tbody>`;
                
        Object.keys(totalsByYear).sort().forEach(year => {
            htmlAnnuale += `<tr><td>${year}</td>`;
            bankList.forEach(b => {
                const val = totalsByYear[year].banks[b] || 0;
                htmlAnnuale += `<td>${val > 0 ? formatCurrency(val) : '-'}</td>`;
            });
            htmlAnnuale += `<td class="total-col">${formatCurrency(totalsByYear[year].total)}</td></tr>`;
        });
        htmlAnnuale += `</tbody></table>`;

        container.innerHTML = htmlMensile + htmlAnnuale;
    }

    function scaricaPDF() {
        const container = document.getElementById('main-container');
        container.classList.add('print-mode');
        
        const opt = {
            margin:       [10, 10, 10, 10],
            filename:     'contabilita-assegni.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };
        
        html2pdf().set(opt).from(container).save().then(() => {
            container.classList.remove('print-mode');
        });
    }

    function renderScadenziario() {
        calcolaRiepiloghi(); 

        const container = document.getElementById('scadenziario');
        container.innerHTML = '';

        if (checks.length === 0) return;

        checks.sort((a, b) => new Date(a.data) - new Date(b.data));

        const grouped = {};
        checks.forEach(c => {
            const my = getMonthYearStr(c.data);
            if (!grouped[my]) grouped[my] = [];
            grouped[my].push(c);
        });

        for (const [month, items] of Object.entries(grouped)) {
            let html = `
            <div class="month-group">
                <div class="month-header">${month}</div>
                <div style="overflow-x: auto;">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th style="width: 110px;">Data</th>
                                <th style="width: 220px;">Banca</th>
                                <th style="width: 100px;">N° Assegno</th>
                                <th>Beneficiario</th>
                                <th>Causale</th>
                                <th style="width: 130px; text-align: right;">Importo</th>
                                <th style="width: 60px;" class="no-print">Azione</th>
                            </tr>
                        </thead>
                        <tbody>`;

            let totaleMese = 0;
            
            items.forEach(c => {
                totaleMese += c.importo;
                
                let rowSelectHtml = `<select class="edit-input no-print" onchange="aggiornaCampo('${c.id}', 'banca', this.value)">`;
                banks.forEach(b => { rowSelectHtml += `<option value="${b}" ${c.banca === b ? 'selected' : ''}>${b}</option>`; });
                rowSelectHtml += `</select>`;

                html += `
                            <tr>
                                <td>
                                    <input type="date" class="edit-input date-input no-print" value="${c.data}" onchange="aggiornaCampo('${c.id}', 'data', this.value)">
                                    <span class="print-only" style="font-weight:bold;">${formatDate(c.data)}</span>
                                </td>
                                <td>
                                    ${rowSelectHtml}
                                    <span class="print-only">${c.banca}</span>
                                </td>
                                <td>
                                    <input type="text" class="edit-input no-print" value="${c.numero}" onchange="aggiornaCampo('${c.id}', 'numero', this.value)">
                                    <span class="print-only">${c.numero}</span>
                                </td>
                                <td>
                                    <input type="text" class="edit-input no-print" value="${c.beneficiario}" onchange="aggiornaCampo('${c.id}', 'beneficiario', this.value)">
                                    <span class="print-only">${c.beneficiario}</span>
                                </td>
                                <td>
                                    <input type="text" class="edit-input no-print" value="${c.causale || ''}" onchange="aggiornaCampo('${c.id}', 'causale', this.value)">
                                    <span class="print-only">${c.causale || ''}</span>
                                </td>
                                <td style="text-align: right;">
                                    <input type="text" class="edit-input edit-amount no-print" value="${formatCurrency(c.importo)}" onchange="aggiornaCampo('${c.id}', 'importo', this.value)">
                                    <span class="print-only edit-amount">${formatCurrency(c.importo)}</span>
                                </td>
                                <td class="no-print">
                                    <button class="delete-btn" onclick="eliminaAssegno('${c.id}')">X</button>
                                </td>
                            </tr>`;
            });

            html += `
                        </tbody>
                        <tfoot>
                            <tr class="total-row">
                                <td colspan="5">Totale ${month}:</td>
                                <td>${formatCurrency(totaleMese)}</td>
                                <td class="no-print"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>`;
            
            container.innerHTML += html;
        }
    }

    init();
</script>
</body>
</html>

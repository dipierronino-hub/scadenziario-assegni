<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenziario Assegni</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { text-align: center; color: #2c3e50; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Stili Form */
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 150px; display: flex; flex-direction: column; }
        label { font-size: 0.9em; font-weight: 600; margin-bottom: 4px; color: #555; }
        input, select, button { padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 6px; }
        input:focus, select:focus { outline: none; border-color: #3498db; }
        .btn-primary { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; height: 100%; margin-top: auto; }
        .btn-secondary { background-color: #ecf0f1; color: #333; border: 1px solid #bdc3c7; margin-top: 10px; cursor: pointer; width: 100%; }

        /* Stili Scadenziario Orizzontale */
        .table-responsive { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .month-group { min-width: 1050px; }
        .month-header { background: #2c3e50; color: #fff; padding: 12px 15px; font-size: 1.1em; font-weight: bold; }
        
        /* Griglia delle righe */
        .check-row { 
            display: grid; 
            grid-template-columns: 100px 200px 120px 1.5fr 1.5fr 120px 80px; 
            gap: 10px; 
            align-items: center; 
            padding: 12px 15px; 
            border-bottom: 1px solid #eee; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .check-row:hover { background-color: #f8f9fa; }
        .check-header { background: #ecf0f1; font-weight: bold; font-size: 0.85em; color: #555; text-transform: uppercase; border-bottom: 2px solid #ddd; }
        
        /* Elementi della riga */
        .date-badge { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; text-align: center; }
        .bank-badge { font-weight: 600; color: #2c3e50; white-space: normal; line-height: 1.2; }
        .amount { font-size: 1.1em; font-weight: bold; color: #27ae60; text-align: right; }
        .text-col { overflow: hidden; text-overflow: ellipsis; }
        .delete-btn { color: #fff; background-color: #e74c3c; cursor: pointer; border: none; padding: 6px 10px; font-size: 0.8em; border-radius: 4px; font-weight: bold; }
        
        .total-row { padding: 15px; background: #fdfefe; text-align: right; font-weight: bold; font-size: 1.2em; border-top: 2px solid #ddd; color: #2c3e50; min-width: 1050px; }
    </style>
</head>
<body>

        <form id="checkForm">
            <div class="form-row">

                </div>
                <div class="form-group">
                    <label>Importo (Usa il punto per i decimali)</label>
                    <input type="number" id="importo" step="0.01" min="0" placeholder="Es. 1500.50" required>
                </div>
                <div class="form-group" style="flex: 1.5;">
                    <label>Banca</label>
                    <select id="banca" required></select>
                </div>
            </div>
            
            <div class="form-row">

                    <label>Numero Assegno</label>
                    <input type="text" id="numeroAssegno" placeholder="Es. 123456" required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Beneficiario</label>
                    <input type="text" id="beneficiario" placeholder="A favore di..." required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Causale</label>
                    <input type="text" id="causale" placeholder="Fattura n... / Rata...">
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn-primary">Aggiungi</button>
                </div>
            </div>
        </form>
        <button class="btn-secondary" onclick="aggiungiBanca()">+ Aggiungi Nuova Banca</button>
    </div>

    <!-- Lista Scadenze -->
    <div id="scadenziario"></div>
</div>

    if (!localStorage.getItem('import_v1_assegni')) {
        checks = [...checks, ...assegniMassivi];
        localStorage.setItem('import_v1_assegni', 'true');
        localStorage.setItem('assegni_data', JSON.stringify(checks));
    }

    const formatCurrency = (num) => {
        let numStr = parseFloat(num).toFixed(2); 
        let parts = numStr.split('.'); 
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "."); 
        return parts.join(',') + ' €'; 
    };

    const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    
    const getMonthYear = (dateStr) => {
        const d = new Date(dateStr);
        return d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
    };

    function init() {
        aggiornaSelectBanche();
        renderScadenziario();
    }

    function aggiornaSelectBanche() {
        const select = document.getElementById('banca');
        select.innerHTML = '';
        banks.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            select.appendChild(opt);
        });
    }

    function aggiungiBanca() {
        const nuova = prompt("Inserisci il nome della nuova Banca:");
        if (nuova && nuova.trim() !== "") {
            banks.push(nuova.trim());
            localStorage.setItem('assegni_banks', JSON.stringify(banks));
            aggiornaSelectBanche();
        }
    }

    document.getElementById('checkForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const check = {
            id: Date.now().toString(),
            data: document.getElementById('data').value,
            importo: parseFloat(document.getElementById('importo').value),
            banca: document.getElementById('banca').value,
            numero: document.getElementById('numeroAssegno').value,
            beneficiario: document.getElementById('beneficiario').value,
            causale: document.getElementById('causale').value
        };
        checks.push(check);
        saveAndRender();
        this.reset();
    });

    function eliminaAssegno(id) {
        if(confirm("Vuoi eliminare questo assegno?")) {
            checks = checks.filter(c => c.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('assegni_data', JSON.stringify(checks));
        renderScadenziario();
    }

    function renderScadenziario() {
        const container = document.getElementById('scadenziario');
        container.innerHTML = '';

        if (checks.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#777;">Nessun assegno inserito.</p>';
            return;
        }

        checks.sort((a, b) => new Date(a.data) - new Date(b.data));

        const grouped = {};
        checks.forEach(c => {
            const my = getMonthYear(c.data);
            if (!grouped[my]) grouped[my] = [];
            grouped[my].push(c);
        });

        for (const [month, items] of Object.entries(grouped)) {
            let html = `
            <div class="table-responsive">
                <div class="month-group">
                    <div class="month-header">${month}</div>
                    
                    <div class="check-row check-header">
                        <div>Data</div>
                        <div>Banca</div>
                        <div>N° Assegno</div>
                        <div>Beneficiario</div>
                        <div>Causale</div>
                        <div style="text-align: right;">Importo</div>
                        <div>Azione</div>
                    </div>`;

            let totaleMese = 0;
            
            items.forEach(c => {
                totaleMese += c.importo;
                html += `
                    <div class="check-row">
                        <div><span class="date-badge">${formatDate(c.data)}</span></div>
                        <div class="bank-badge">${c.banca}</div>
                        <div>${c.numero}</div>
                        <div class="text-col" title="${c.beneficiario}">${c.beneficiario}</div>
                        <div class="text-col" title="${c.causale || ''}">${c.causale || '-'}</div>
                        <div class="amount">${formatCurrency(c.importo)}</div>
                        <div><button class="delete-btn" onclick="eliminaAssegno('${c.id}')">Elimina</button></div>
                    </div>`;
            });

            html += `
                    <div class="total-row">
                        Totale ${month}: ${formatCurrency(totaleMese)}
                    </div>
                </div>
            </div>`;
            
            container.innerHTML += html;
        }
    }

    init();
</script>
</body>
</html>

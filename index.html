<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenziario Assegni</title>
    <!-- Libreria per esportare in PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 10px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 { text-align: center; color: #2c3e50; margin: 10px 0; }
        .card { background: #fff; padding: 10px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* Layout Strumenti */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .btn-group { display: flex; gap: 10px; }
        
        /* Stili Form */
        .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .form-group { flex: 1; min-width: 130px; display: flex; flex-direction: column; }
        label { font-size: 0.85em; font-weight: 600; margin-bottom: 2px; color: #555; }
        input, select, button { padding: 6px 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; }
        input:focus, select:focus { outline: none; border-color: #3498db; }
        
        .btn-primary { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; height: 100%; margin-top: auto; }
        .btn-secondary { background-color: #ecf0f1; color: #333; border: 1px solid #bdc3c7; cursor: pointer; font-weight: bold; }
        .btn-pdf { background-color: #e74c3c; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-print { background-color: #2c3e50; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* Stili Scadenziario Orizzontale */
        .table-responsive { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .month-group { min-width: 1050px; }
        .month-header { background: #2c3e50; color: #fff; padding: 8px 15px; font-size: 1.1em; font-weight: bold; }
        
        /* Griglia - Layout Base */
        .check-row { 
            display: grid; 
            grid-template-columns: 120px 200px 100px 1.5fr 1.5fr 110px 40px; 
            gap: 8px; 
            align-items: center; 
            padding: 4px 10px; 
            border-bottom: 1px solid #eee; 
            font-size: 0.9em;
        }
        .check-row:hover { background-color: #f8f9fa; }
        .check-header { background: #ecf0f1; font-weight: bold; font-size: 0.8em; color: #555; text-transform: uppercase; border-bottom: 2px solid #ddd; padding: 8px 10px; }
        
        /* Input Modificabili in riga */
        .edit-input { width: 100%; border: 1px solid transparent; background: transparent; font-family: inherit; font-size: inherit; padding: 4px; border-radius: 4px; box-sizing: border-box; }
        .edit-input:hover { border-color: #ccc; background: #fff; }
        .edit-input:focus { border-color: #3498db; background: #fff; outline: none; }
        
        .edit-amount { text-align: right; font-weight: bold; color: #27ae60; }
        
        .date-input { background: #e74c3c; color: white; font-weight: bold; border-radius: 4px; text-align: center; border: none; }
        .date-input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        
        .delete-btn { color: #fff; background-color: #e74c3c; cursor: pointer; border: none; padding: 4px 8px; font-size: 0.8em; border-radius: 4px; font-weight: bold; }
        .total-row { padding: 10px 15px; background: #fdfefe; text-align: right; font-weight: bold; font-size: 1.1em; border-top: 2px solid #ddd; color: #2c3e50; min-width: 1050px; }

        /* Ottimizzazione per PDF e Stampa (Nasconde form, pulsanti e colonna azioni) */
        .print-mode .no-print { display: none !important; }
        .print-mode .check-row { grid-template-columns: 110px 200px 100px 1.5fr 1.5fr 110px !important; border-bottom: 1px solid #ccc; }
        .print-mode .edit-input { border: none !important; padding: 0 !important; background: transparent !important; color: #000 !important; }
        .print-mode .date-input { background: transparent !important; color: #000 !important; font-weight: normal; }

        @media print {
            body { background: #fff; padding: 0; }
            .no-print { display: none !important; }
            .container { max-width: 100%; }
            .card, .table-responsive { box-shadow: none; border: none; }
            .month-group { page-break-inside: avoid; margin-bottom: 20px; border: 1px solid #ddd; }
            .check-row { grid-template-columns: 110px 200px 100px 1.5fr 1.5fr 110px !important; border-bottom: 1px solid #000; }
            .edit-input { border: none !important; padding: 0 !important; background: transparent !important; color: #000 !important; }
            .date-input { background: transparent !important; color: #000 !important; font-weight: normal; }
            .date-input::-webkit-calendar-picker-indicator { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar no-print">
        <h2>Gestione Assegni</h2>
        <div class="btn-group">
            <button class="btn-print" onclick="window.print()">🖨️ Stampa</button>
            <button class="btn-pdf" onclick="scaricaPDF()">📄 Scarica PDF</button>
        </div>
    </div>

    <!-- Form Inserimento -->
    <div class="card no-print">
        <form id="checkForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label>Importo</label>
                    <input type="number" id="importo" step="0.01" min="0" placeholder="Es. 1500.50" required>
                </div>
                <div class="form-group" style="flex: 1.5;">
                    <label>Banca</label>
                    <select id="banca" required></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>N° Assegno</label>
                    <input type="text" id="numeroAssegno" placeholder="Es. 123456" required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Beneficiario</label>
                    <input type="text" id="beneficiario" placeholder="A favore di..." required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Causale</label>
                    <input type="text" id="causale" placeholder="Fattura n... / Rata...">
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn-primary">Aggiungi Assegno</button>
                </div>
            </div>
        </form>
        <button class="btn-secondary" onclick="aggiungiBanca()" style="width: 100%; margin-top: 10px;">+ Aggiungi Nuova Banca</button>
    </div>

    <!-- Lista Scadenze -->
    <div id="scadenziario"></div>
</div>

<script>
    let banks = JSON.parse(localStorage.getItem('assegni_banks')) || ["Banca Popolare di Puglia e Basilicata", "Banca Popolare Pugliese"];
    let checks = JSON.parse(localStorage.getItem('assegni_data')) || [];

    // Funzione rigorosa per formattare la valuta (Es: 1.500,50 €)
    const formatCurrency = (num) => {
        let numStr = parseFloat(num).toFixed(2); 
        let parts = numStr.split('.'); 
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "."); 
        return parts.join(',') + ' €'; 
    };

    const getMonthYear = (dateStr) => {
        const d = new Date(dateStr);
        return d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
    };

    function init() {
        aggiornaSelectBanche();
        renderScadenziario();
    }

    function aggiornaSelectBanche() {
        const select = document.getElementById('banca');
        select.innerHTML = '';
        banks.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            select.appendChild(opt);
        });
    }

    function aggiungiBanca() {
        const nuova = prompt("Inserisci il nome della nuova Banca:");
        if (nuova && nuova.trim() !== "") {
            banks.push(nuova.trim());
            localStorage.setItem('assegni_banks', JSON.stringify(banks));
            aggiornaSelectBanche();
            renderScadenziario();
        }
    }

    // Aggiunta Assegno
    document.getElementById('checkForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const check = {
            id: Date.now().toString(),
            data: document.getElementById('data').value,
            importo: parseFloat(document.getElementById('importo').value),
            banca: document.getElementById('banca').value,
            numero: document.getElementById('numeroAssegno').value,
            beneficiario: document.getElementById('beneficiario').value,
            causale: document.getElementById('causale').value
        };
        checks.push(check);
        saveAndRender();
        this.reset();
    });

    // Funzione universale per l'aggiornamento dei campi in tempo reale
    window.aggiornaCampo = function(id, campo, valore) {
        const check = checks.find(c => c.id === id);
        if (check) {
            if (campo === 'importo') {
                // Riconverte il testo "1.500,50 €" in numero puro "1500.50" per i calcoli
                let numeroPulito = valore.replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
                check.importo = parseFloat(numeroPulito) || 0;
            } else {
                check[campo] = valore;
            }
            localStorage.setItem('assegni_data', JSON.stringify(checks));
            renderScadenziario();
        }
    };

    function eliminaAssegno(id) {
        if(confirm("Vuoi eliminare questo assegno?")) {
            checks = checks.filter(c => c.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('assegni_data', JSON.stringify(checks));
        renderScadenziario();
    }

    // Esportazione in PDF
    function scaricaPDF() {
        const container = document.getElementById('scadenziario');
        container.classList.add('print-mode'); // Nasconde temporaneamente le colonne azioni
        
        const opt = {
            margin:       10,
            filename:     'scadenziario-assegni.pdf',
            image:        { type: 'jpeg', quality: 1 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        
        html2pdf().set(opt).from(container).save().then(() => {
            container.classList.remove('print-mode'); // Ripristina la visualizzazione normale
        });
    }

    function renderScadenziario() {
        const container = document.getElementById('scadenziario');
        container.innerHTML = '';

        if (checks.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#777;">Nessun assegno inserito.</p>';
            return;
        }

        // L'ordinamento avviene RIGOROSAMENTE per data. Assegni con la stessa data appaiono adiacenti.
        checks.sort((a, b) => new Date(a.data) - new Date(b.data));

        const grouped = {};
        checks.forEach(c => {
            const my = getMonthYear(c.data);
            if (!grouped[my]) grouped[my] = [];
            grouped[my].push(c);
        });

        for (const [month, items] of Object.entries(grouped)) {
            let html = `
            <div class="table-responsive">
                <div class="month-group">
                    <div class="month-header">${month}</div>
                    
                    <div class="check-row check-header">
                        <div>Data</div>
                        <div>Banca</div>
                        <div>N° Assegno</div>
                        <div>Beneficiario</div>
                        <div>Causale</div>
                        <div style="text-align: right;">Importo</div>
                        <div class="no-print"></div>
                    </div>`;

            let totaleMese = 0;
            
            items.forEach(c => {
                totaleMese += c.importo;
                
                let rowSelectHtml = `<select class="edit-input" onchange="aggiornaCampo('${c.id}', 'banca', this.value)">`;
                banks.forEach(b => { rowSelectHtml += `<option value="${b}" ${c.banca === b ? 'selected' : ''}>${b}</option>`; });
                rowSelectHtml += `</select>`;

                // Ogni campo è un input che aggiorna la memoria al cambio (onchange)
                html += `
                    <div class="check-row">
                        <div><input type="date" class="edit-input date-input" value="${c.data}" onchange="aggiornaCampo('${c.id}', 'data', this.value)"></div>
                        <div>${rowSelectHtml}</div>
                        <div><input type="text" class="edit-input" value="${c.numero}" onchange="aggiornaCampo('${c.id}', 'numero', this.value)"></div>
                        <div><input type="text" class="edit-input" value="${c.beneficiario}" onchange="aggiornaCampo('${c.id}', 'beneficiario', this.value)"></div>
                        <div><input type="text" class="edit-input" value="${c.causale || ''}" onchange="aggiornaCampo('${c.id}', 'causale', this.value)"></div>
                        <div><input type="text" class="edit-input edit-amount" value="${formatCurrency(c.importo)}" onchange="aggiornaCampo('${c.id}', 'importo', this.value)"></div>
                        <div class="no-print"><button class="delete-btn" onclick="eliminaAssegno('${c.id}')">X</button></div>
                    </div>`;
            });

            html += `
                    <div class="total-row">
                        Totale ${month}: ${formatCurrency(totaleMese)}
                    </div>
                </div>
            </div>`;
            
            container.innerHTML += html;
        }
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scadenziario Assegni</title>
<style>
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#ecf0f1;color:#333;margin:0;padding:15px}
.container{max-width:1200px;margin:0 auto}
h2{color:#2c3e50;margin:10px 0;font-size:26px;text-transform:uppercase;letter-spacing:1px}
.card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:20px;border-top:5px solid #3498db}
.filter-card{background:#2c3e50;padding:15px 20px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;border:none}
.filter-label{color:#fff;font-weight:700;margin:0}
.filter-card select,.filter-card input{flex:1;min-width:180px;max-width:380px;font-weight:700;border:2px solid #3498db;padding:11px}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.tb-btns{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 14px;font-size:14px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-weight:700}
button:hover{opacity:.9}
.btn-primary{background:#3498db;color:#fff;height:100%}
.btn-secondary{background:#e3e7e8;color:#2c3e50;border-color:#bdc3c7;width:100%;margin-top:15px}
.btn-pdf{background:#e74c3c;color:#fff}.btn-tool{background:#2c3e50;color:#fff}
.form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.form-group{flex:1;min-width:140px;display:flex;flex-direction:column}
label{font-size:.85em;font-weight:700;margin-bottom:6px;color:#555;text-transform:uppercase}
input,select{padding:10px;font-size:14px;border:1px solid #bdc3c7;border-radius:6px;box-sizing:border-box;background:#fcfcfc}
input:focus,select:focus{outline:none;border-color:#3498db;box-shadow:0 0 0 3px rgba(52,152,219,.2)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{flex:1;min-width:200px;background:#fff;border-radius:8px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:700;color:#2c3e50}
.stat b{display:block;font-size:1.3em;margin-top:4px}
.stat.red b{color:#c0392b}.stat.amber b{color:#d35400}
.summary-section{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:30px;border-top:5px solid #f39c12}
.summary-section h3{color:#d35400;margin:0 0 15px;text-transform:uppercase;font-size:1.1em}
.summary-table{width:100%;border-collapse:collapse;margin-bottom:25px}
.summary-table th,.summary-table td{border:1px solid #bdc3c7;padding:12px;text-align:right}
.summary-table th{background:#34495e;color:#fff;text-align:center}
.summary-table td:first-child{text-align:left;font-weight:700;background:#ecf0f1;color:#2c3e50}
.col-pagato{background:#e8f8f5;color:#27ae60}
.col-residuo{background:#fdebd0;color:#d35400;font-weight:900}
.month-group{background:#fff;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:30px;overflow:hidden}
.month-header{background:#34495e;color:#fff;padding:15px 20px;font-size:1.2em;font-weight:800;text-transform:uppercase;letter-spacing:2px}
.header-pagati{background:#27ae60}
.table-wrapper{overflow-x:auto}
.modern-table{width:100%;border-collapse:collapse;min-width:900px}
.modern-table th{background:#ecf0f1;color:#2c3e50;font-weight:800;font-size:.85em;text-transform:uppercase;padding:14px 10px;border-bottom:3px solid #95a5a6;text-align:left}
.modern-table td{padding:8px 10px;border-bottom:2px solid #aeb6bf;vertical-align:middle}
.modern-table tbody tr:nth-child(even){background:#e3f0f9}
.modern-table tbody tr:hover{background:#cce5ff}
.modern-table tbody tr.scad td:first-child{box-shadow:inset 6px 0 #c0392b}
.modern-table tbody tr.prox td:first-child{box-shadow:inset 6px 0 #f39c12}
.modern-table tbody tr.rp{background:#e8f8f5}.modern-table tbody tr.rp:nth-child(even){background:#d1f2eb}
.rp td{color:#7f8c8d;border-bottom-color:#a3e4d7!important}
.rp .edit-amount{color:#27ae60;text-decoration:line-through}
.col-importo,.th-imp{text-align:right!important}
.col-data{width:125px}.col-num{width:95px}.col-banca{width:170px}.col-azione{width:95px}
.ei{width:100%;border:1px solid transparent;background:transparent;font:inherit;padding:6px;border-radius:4px;color:#2c3e50;font-weight:600;text-overflow:ellipsis}
.ei:hover{border-color:#95a5a6;background:#fff}
.di{background:#e74c3c;color:#fff;text-align:center}.rp .di{background:#27ae60}
.causale{font-size:.82em}
.edit-amount{text-align:right;font-weight:900;color:#e74c3c;font-size:1.05em}
.action-cell{display:flex;flex-direction:column;gap:6px}
.cb-label{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;padding:4px;background:#ecf0f1;border:1px solid #bdc3c7;border-radius:4px;cursor:pointer;text-transform:none;color:#2c3e50}
.delete-btn{background:#c0392b;color:#fff;padding:5px;font-size:.8em;width:100%}
.total-row td{padding:16px 20px;text-align:right;font-weight:900;font-size:1.25em;color:#c0392b;border-top:3px solid #e74c3c}
.total-row.pg td{color:#27ae60;border-top-color:#27ae60}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:12px 18px;border-radius:8px;display:none;gap:14px;align-items:center;z-index:9}
#toast button{background:#f39c12;color:#fff;padding:6px 12px}
.po{display:none}
@media print{
@page{size:A4 landscape;margin:10mm}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
body{background:#fff;padding:0;font-size:11px}
.container{max-width:none}
.no-print{display:none!important}
.po{display:inline}
.summary-section,.month-group{box-shadow:none;border:none;border-radius:0;margin-bottom:16px;overflow:visible}
.table-wrapper{overflow:visible}
.modern-table{min-width:0;table-layout:auto}
thead{display:table-header-group}
tfoot{display:table-row-group}
tr{break-inside:avoid}
.month-header{padding:8px 12px;font-size:14px;break-after:avoid}
.modern-table td,.modern-table th,.summary-table td,.summary-table th{border:1px solid #000;padding:5px 7px;font-size:11px;color:#000;background:transparent!important;word-wrap:break-word}
.modern-table th,.summary-table th{background:#e8e8e8!important}
.modern-table tbody tr{background:#fff!important}
.modern-table tbody tr td:first-child{box-shadow:none!important}
.edit-amount{color:#000;font-weight:700}
.total-row td{border-top:2px solid #000;background:#f4f4f4!important;color:#000;font-size:12px}
.modern-table td,.modern-table th{width:auto}
}
</style>
</head>
<body>
<div class="container">
<div class="toolbar no-print">
<h2>Gestione Assegni</h2>
<div class="tb-btns">
<button class="btn-tool" onclick="esportaJSON()">💾 Backup</button>
<button class="btn-tool" onclick="document.getElementById('imp').click()">📂 Ripristina</button>
<button class="btn-tool" onclick="esportaCSV()">📊 CSV</button>
<button class="btn-pdf" onclick="stampa()">📄 Stampa / PDF</button>
<input type="file" id="imp" accept=".json" hidden>
</div>
</div>
<datalist id="lista-beneficiari"></datalist>
<div class="card filter-card no-print">
<label class="filter-label">👁️ Visualizza:</label>
<select id="filtro-banca"><option value="TUTTE">TUTTE LE BANCHE INSIEME</option></select>
<input type="search" id="cerca" placeholder="🔎 Cerca beneficiario, numero, causale">
</div>
<div class="card no-print">
<form id="checkForm">
<div class="form-row">
<div class="form-group"><label>Data Scadenza</label><input type="date" id="data" required></div>
<div class="form-group"><label>Importo</label><input type="number" id="importo" step="0.01" min="0" placeholder="Es. 1500.50" required></div>
<div class="form-group" style="flex:1.5"><label>Banca Trassata</label><select id="banca" required></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>N° Assegno</label><input type="text" id="numeroAssegno" placeholder="Es. 123456" required></div>
<div class="form-group" style="flex:2"><label>Beneficiario</label><input type="text" id="beneficiario" list="lista-beneficiari" autocomplete="off" required></div>
<div class="form-group" style="flex:2"><label>Causale</label><input type="text" id="causale" placeholder="Fattura n... / Rata..."></div>
<div class="form-group"><label>&nbsp;</label><button type="submit" class="btn-primary">Registra Assegno</button></div>
</div>
</form>
<button class="btn-secondary" onclick="aggiungiBanca()">+ Aggiungi Nuova Banca in Rubrica</button>
</div>
<div class="stats no-print" id="stats"></div>
<div id="riepilogo" class="summary-section"></div>
<div id="da-pagare"></div>
<div id="sezione-pagati" style="display:none">
<h2 style="color:#27ae60;margin-top:40px;border-bottom:4px solid #27ae60;padding-bottom:10px;font-size:24px">✅ Storico Assegni Pagati</h2>
<div id="pagati"></div>
</div>
</div>
<div id="toast"><span id="toast-msg"></span><button id="toast-undo">Annulla</button></div>

<script>
const B0="Banca Popolare di Puglia e Basilicata";
const MESI=["GENNAIO","FEBBRAIO","MARZO","APRILE","MAGGIO","GIUGNO","LUGLIO","AGOSTO","SETTEMBRE","OTTOBRE","NOVEMBRE","DICEMBRE"];
const SEED=`09-30|2360.37|72802|ADESITAL SPA|FT. N. 3613 DEL 12/06/25+4078+1897

10-10|2853.31|74207|CARDINALE FERRAMENTA SPA|FT.N.20863 DEL 14/04/26+FT.26196 -N.C.

10-16|1150.27|7619|TSC EDILIZIA SRL|ACC.FT.N. 367 DEL 30/04/26 (R.B. 10/08)
10-20|5644.94|74209|PROGETTOMATERIA SRL|FT. N. 260241 DEL 25/05/26
10-20|3486.63|75134|CVR SPA|S/FT.N. 4127 DEL 30/06/26
10-21|3937.68|74511|EKORU SRL|S/FT. N. 1144 DEL 15/05/26
10-21|4369.39|74512|PROGETTOMATERIA SRL|C/FT. N. 299 DEL 05/06/26
10-26|2794.04|75137|FASSA SRL|S/FT.+N.C. DA FEBBRAIO A GIUGNO
10-27|1286.28|74739|CARDINALE FERRAMENTA SPA|FT.N.28617 DEL 18/05/26+3001+31290+3314

10-31|2280.86|74731|PROGETTOMATERIA SRL|FT. N. 260313 DEL 16/06/26
10-31|3366.96|74925|GRUPPO GEROMIN SRL|FT.N.2648 DEL 23/03/26+3291
10-31|3185.02|74926|LATERFIAMMA SRL|FT. N. 387 DEL 31/03/26
10-31|1516.87|75463|FORTE SRL|FT. N. 1795 DEL 30/04/26+SPESE
10-31|2829.03|75464|EKORU SRL|FT. N. 1402 DEL 15/06/26
11-05|2561.70|75467|FIMA CARLO FRATTINI SPA|FT. N. 5308+8226+11308+12214
11-05|1537.63|7833|FORTE SRL|FT.N.2382 DEL 31/05/26
11-09|1975.56|74740|CARDINALE FERRAMENTA SPA|FT.N.27913-NC. 27221 DEL 06/05/26
11-10|3637.65|75138|FASSA SRL|S/FT.+N.C. DA FEBBRAIO A GIUGNO

11-10|2211.45|7620|DIANFLEX SRL|R.B. AL 10/08/26+10/09/26+ACC. SU FT. SUCCESSIV
11-12|1961.15|75468|GSG CERAMIC DESIGN SRL|FT.N. 549+739
11-15|1239.36|75466|NAICI ITALIA SRL|FT. N. 4875 DEL 21/07/26

11-20|7020.22|74928|PROGETTOMATERIA SRL|FT. N. 260319 DEL 24/06/26
11-27|3739.35|75139|FASSA SRL|S/FT.+N.C. DA FEBBRAIO A GIUGNO
11-30|2729.61|75470|THE ITALIAN DECKING COMPANY SPA|FT. N. 8958 DEL 20/08/26
11-30|2500.00|727837|ICOBIT ITALIA SRL|FT. N. 3501 DEL 06/07/26
12-05|2000.00|7834|FORTE SRL|FT.N. 2382 DEL 31/05/26
12-10|3285.38|75462|CARDINALE FERRAMENTA SPA|FT.N.35649+36612+38296+40534
12-11|3518.00|75140|FASSA SRL|S/FT.+N.C. DA FEBBRAIO A GIUGNO
12-11|6561.66|7832|CVR SPA|S/FT. N. 4876 DEL 31/07/26
12-14|2000.00|74516|HERBERIA S.P.A.|FT.N. 7154 +7190 DEL 30/06/26
12-15|2443.21|75461|IGIEMME SRL|FTN, 2084 DEL 20/07/26
12-18|3019.59|7614|CARDINALE FERRAMENTA SPA|FT.N.43102 DEL 13/07/26+43051+43725`;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const cents=n=>Math.round((+n||0)*100);
const fmt=c=>{const a=Math.abs(c);return(c<0?'-':'')+Math.floor(a/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+String(a%100).padStart(2,'0')+' €'};
const fd=s=>s?s.split('-').reverse().join('/'):'';
const monthLabel=k=>{const[y,m]=k.split('-');return MESI[+m-1]+' '+y};
const parseImp=v=>Math.round((parseFloat(String(v).replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))||0)*100)/100;
const isoDay=d=>{const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};

let banks=load('assegni_banks',[B0,"Banca Popolare Pugliese"]);
let checks=load('assegni_data',[]);
if(!Array.isArray(checks)||!checks.length){
  checks=SEED.split('\n').map((r,i)=>{const[d,imp,n,b,c]=r.split('|');return{id:'m'+(i+1),data:'2026-'+d,importo:+imp,banca:B0,numero:n,beneficiario:b,causale:c,pagato:false}});
  salva();
}
checks.forEach(c=>{if(c.pagato===undefined)c.pagato=false});

function salva(){localStorage.setItem('assegni_data',JSON.stringify(checks))}
function salvaERender(){salva();aggiornaBeneficiari();render()}

function aggiornaBeneficiari(){
  const dl=$('lista-beneficiari');
  dl.innerHTML=[...new Set(checks.map(c=>(c.beneficiario||'').trim()))].filter(Boolean).sort().map(n=>`<option value="${esc(n)}">`).join('');
}
function aggiornaBanche(){
  const cur=$('filtro-banca').value||'TUTTE';
  $('banca').innerHTML=banks.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  $('filtro-banca').innerHTML='<option value="TUTTE">TUTTE LE BANCHE INSIEME</option>'+banks.map(b=>`<option value="${esc(b)}">Solo ${esc(b.toUpperCase())}</option>`).join('');
  $('filtro-banca').value=(cur==='TUTTE'||banks.includes(cur))?cur:'TUTTE';
}
function aggiungiBanca(){
  const n=(prompt("Inserisci il nome della nuova Banca:")||'').trim();
  if(n&&!banks.includes(n)){banks.push(n);localStorage.setItem('assegni_banks',JSON.stringify(banks));aggiornaBanche();render()}
}
function duplicato(numero,banca,ignoraId){
  return checks.some(c=>c.id!==ignoraId&&c.banca===banca&&String(c.numero).trim()===String(numero).trim());
}

$('checkForm').addEventListener('submit',e=>{
  e.preventDefault();
  const numero=$('numeroAssegno').value.trim(),banca=$('banca').value;
  if(duplicato(numero,banca)&&!confirm(`L'assegno n° ${numero} esiste già per questa banca. Registrarlo comunque?`))return;
  checks.push({id:Date.now().toString(),data:$('data').value,importo:Math.round(parseFloat($('importo').value)*100)/100,banca,numero,beneficiario:$('beneficiario').value.trim(),causale:$('causale').value,pagato:false});
  salvaERender();e.target.reset();
});

document.addEventListener('change',e=>{
  const t=e.target,tr=t.closest&&t.closest('tr[data-id]');
  if(!tr||!t.dataset.f)return;
  const c=checks.find(x=>x.id===tr.dataset.id);if(!c)return;
  const f=t.dataset.f;
  if(f==='importo')c.importo=parseImp(t.value);
  else if(f==='pagato')c.pagato=t.checked;
  else{
    if(f==='numero'&&duplicato(t.value,c.banca,c.id)&&!confirm(`Il n° ${t.value} esiste già per questa banca. Confermi?`)){t.value=c.numero;return}
    c[f]=t.value;
  }
  salvaERender();
});
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-del]');if(!b)return;
  const i=checks.findIndex(c=>c.id===b.dataset.del);if(i<0)return;
  const[rim]=checks.splice(i,1);salvaERender();
  toast(`Eliminato: ${rim.beneficiario} ${fmt(cents(rim.importo))}`,()=>{checks.push(rim);salvaERender()});
});
let toastT;
function toast(msg,undo){
  $('toast-msg').textContent=msg;$('toast').style.display='flex';
  $('toast-undo').onclick=()=>{undo();$('toast').style.display='none'};
  clearTimeout(toastT);toastT=setTimeout(()=>$('toast').style.display='none',8000);
}

function riepilogo(dati){
  const m={},y={};
  dati.forEach(c=>{
    const k=c.data.slice(0,7),a=c.data.slice(0,4),v=cents(c.importo);
    m[k]=m[k]||{e:0,p:0,r:0};y[a]=y[a]||{e:0,p:0,r:0};
    [m[k],y[a]].forEach(o=>{o.e+=v;c.pagato?o.p+=v:o.r+=v});
  });
  const tab=(tit,obj,lab)=>`<h3>${tit}</h3><div class="table-wrapper"><table class="summary-table"><thead><tr><th>${tit.includes('Mens')?'Mese':'Anno'}</th><th>Totale Emesso</th><th class="col-pagato">Già Pagato</th><th class="col-residuo">DA PAGARE (Residuo)</th></tr></thead><tbody>${
    Object.keys(obj).sort().map(k=>`<tr><td>${lab(k)}</td><td>${fmt(obj[k].e)}</td><td class="col-pagato">${fmt(obj[k].p)}</td><td class="col-residuo">${fmt(obj[k].r)}</td></tr>`).join('')
  }</tbody></table></div>`;
  $('riepilogo').innerHTML=dati.length?tab('Situazione Mensile',m,monthLabel)+tab('Situazione Annuale',y,k=>k):'<p>Nessun dato corrispondente al filtro.</p>';
}

function stato(c,oggi,tra7){
  if(c.pagato)return'rp';
  return c.data<oggi?'scad':c.data<=tra7?'prox':'';
}

function riga(c,oggi,tra7){
  const opts=banks.map(b=>`<option value="${esc(b)}"${c.banca===b?' selected':''}>${esc(b)}</option>`).join('');
  return`<tr data-id="${esc(c.id)}" class="${stato(c,oggi,tra7)}">
<td class="col-data"><input type="date" class="ei di no-print" data-f="data" value="${esc(c.data)}"><b class="po">${fd(c.data)}</b></td>
<td class="col-banca"><select class="ei no-print" data-f="banca">${opts}</select><span class="po">${esc(c.banca)}</span></td>
<td class="col-num"><input type="text" class="ei no-print" data-f="numero" value="${esc(c.numero)}"><span class="po">${esc(c.numero)}</span></td>
<td><input type="text" class="ei no-print" data-f="beneficiario" list="lista-beneficiari" value="${esc(c.beneficiario)}" title="${esc(c.beneficiario)}"><span class="po">${esc(c.beneficiario)}</span></td>
<td><input type="text" class="ei causale no-print" data-f="causale" value="${esc(c.causale)}" title="${esc(c.causale)}"><span class="po causale">${esc(c.causale)}</span></td>
<td class="col-importo"><input type="text" class="ei edit-amount no-print" data-f="importo" value="${fmt(cents(c.importo))}"><span class="po edit-amount">${fmt(cents(c.importo))}</span></td>
<td class="col-azione no-print"><div class="action-cell"><label class="cb-label"><input type="checkbox" data-f="pagato"${c.pagato?' checked':''}> Pagato</label><button class="delete-btn" data-del="${esc(c.id)}">Elimina</button></div></td>
</tr>`;
}

function gruppi(dati,cont,pagato){
  const g={};
  dati.forEach(c=>(g[c.data.slice(0,7)]=g[c.data.slice(0,7)]||[]).push(c));
  const oggi=isoDay(new Date()),t=new Date();t.setDate(t.getDate()+7);const tra7=isoDay(t);
  cont.innerHTML=Object.keys(g).sort().map(k=>{
    const tot=g[k].reduce((s,c)=>s+cents(c.importo),0);
    return`<div class="month-group"><div class="month-header${pagato?' header-pagati':''}">${monthLabel(k)}</div><div class="table-wrapper"><table class="modern-table"><thead><tr><th class="col-data">Data</th><th class="col-banca">Banca</th><th class="col-num">N° Assegno</th><th>Beneficiario</th><th>Causale</th><th class="th-imp">Importo</th><th class="col-azione no-print">Stato</th></tr></thead><tbody>${g[k].map(c=>riga(c,oggi,tra7)).join('')}</tbody><tfoot><tr class="total-row${pagato?' pg':''}"><td colspan="5">Totale ${pagato?'Pagato':'DA PAGARE'} ${monthLabel(k)}:</td><td>${fmt(tot)}</td><td class="no-print"></td></tr></tfoot></table></div></div>`;
  }).join('');
}

function filtrati(){
  const fb=$('filtro-banca').value,q=$('cerca').value.trim().toLowerCase();
  return checks.filter(c=>(fb==='TUTTE'||c.banca===fb)&&(!q||[c.beneficiario,c.numero,c.causale].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.data.localeCompare(b.data));
}

function render(){
  const dati=filtrati();
  riepilogo(dati);
  const oggi=isoDay(new Date()),t=new Date();t.setDate(t.getDate()+7);const tra7=isoDay(t);
  const np=dati.filter(c=>!c.pagato);
  const sc=np.filter(c=>c.data<oggi),pr=np.filter(c=>c.data>=oggi&&c.data<=tra7);
  const somma=a=>fmt(a.reduce((s,c)=>s+cents(c.importo),0));
  $('stats').innerHTML=`<div class="stat red">Scaduti non pagati (${sc.length})<b>${somma(sc)}</b></div><div class="stat amber">In scadenza entro 7 giorni (${pr.length})<b>${somma(pr)}</b></div><div class="stat">Totale da pagare (${np.length})<b>${somma(np)}</b></div>`;
  const pag=dati.filter(c=>c.pagato);
  if(!dati.length){$('da-pagare').innerHTML='<p style="text-align:center;padding:20px">Nessun assegno trovato per questa selezione.</p>';$('sezione-pagati').style.display='none';return}
  if(np.length)gruppi(np,$('da-pagare'),false);
  else $('da-pagare').innerHTML='<p style="text-align:center;color:#7f8c8d;padding:20px;font-weight:700">Tutti gli assegni del periodo sono stati pagati.</p>';
  $('sezione-pagati').style.display=pag.length?'block':'none';
  if(pag.length)gruppi(pag,$('pagati'),true);
}

function stampa(){
  alert('Nella finestra di stampa scegli "Salva come PDF" (orizzontale) e spunta "Grafica di sfondo" per vedere i colori.');
  window.print();
}
function scarica(nome,tipo,contenuto){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenuto],{type:tipo}));
  a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function esportaJSON(){scarica('backup-assegni-'+isoDay(new Date())+'.json','application/json',JSON.stringify({banks,checks},null,1))}
function esportaCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const righe=[['Data','Banca','Numero','Beneficiario','Causale','Importo','Pagato'].map(q).join(';')]
    .concat(filtrati().map(c=>[fd(c.data),c.banca,c.numero,c.beneficiario,c.causale,c.importo.toFixed(2).replace('.',','),c.pagato?'SI':'NO'].map(q).join(';')));
  scarica('assegni-'+isoDay(new Date())+'.csv','text/csv;charset=utf-8','\ufeff'+righe.join('\r\n'));
}
$('imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.checks))throw 0;
      if(!confirm(`Il backup contiene ${d.checks.length} assegni. Sostituire TUTTI i dati attuali?`))return;
      checks=d.checks.map((c,i)=>({id:String(c.id||Date.now()+'_'+i),data:String(c.data||''),importo:+c.importo||0,banca:String(c.banca||B0),numero:String(c.numero||''),beneficiario:String(c.beneficiario||''),causale:String(c.causale||''),pagato:!!c.pagato}));
      if(Array.isArray(d.banks)&&d.banks.length){banks=d.banks.map(String);localStorage.setItem('assegni_banks',JSON.stringify(banks))}
      aggiornaBanche();salvaERender();
    }catch(err){alert('File di backup non valido.')}
    e.target.value='';
  };
  r.readAsText(f);
});
$('filtro-banca').addEventListener('change',render);
$('cerca').addEventListener('input',render);

aggiornaBanche();aggiornaBeneficiari();render();
</script>
</body>
</html>

            { id: "m47", data: "2026-12-11", importo: 3518.00, banca: bancaPredefinita, numero: "75140", beneficiario: "FASSA SRL", causale: "S/FT.+N.C. DA FEBBRAIO A GIUGNO", pagato: false },
            { id: "m48", data: "2026-12-11", importo: 6561.66, banca: bancaPredefinita, numero: "7832", beneficiario: "CVR SPA", causale: "S/FT. N. 4876 DEL 31/07/26", pagato: false },
            { id: "m49", data: "2026-12-14", importo: 2000.00, banca: bancaPredefinita, numero: "74516", beneficiario: "HERBERIA S.P.A.", causale: "FT.N. 7154 +7190 DEL 30/06/26", pagato: false },
            { id: "m50", data: "2026-12-15", importo: 2443.21, banca: bancaPredefinita, numero: "75461", beneficiario: "IGIEMME SRL", causale: "FTN, 2084 DEL 20/07/26", pagato: false },
            { id: "m51", data: "2026-12-18", importo: 3019.59, banca: bancaPredefinita, numero: "7614", beneficiario: "CARDINALE FERRAMENTA SPA", causale: "FT.N.43102 DEL 13/07/26+43051+43725", pagato: false }
        ];
        checks = [...assegniMassivi];
        localStorage.setItem('assegni_data', JSON.stringify(checks));
    }

    const formatCurrency = (num) => {
        let numStr = parseFloat(num).toFixed(2); 
        let parts = numStr.split('.'); 
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "."); 
        return parts.join(',') + ' €'; 
    };

    const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
    };

    const getMonthYearStr = (dateStr) => {
        const d = new Date(dateStr);
        return d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
    };

    function init() {
        aggiornaSelectBanche();
        aggiornaListaBeneficiari();
        renderScadenziario();
    }

    function aggiornaListaBeneficiari() {
        const datalist = document.getElementById('lista-beneficiari');
        if(!datalist) return;
        datalist.innerHTML = '';
        const nomiUnivoci = [...new Set(checks.map(c => c.beneficiario.trim()))].filter(n => n !== '');
        nomiUnivoci.sort().forEach(nome => {
            let option = document.createElement('option');
            option.value = nome;
            datalist.appendChild(option);
        });
    }

    function aggiornaSelectBanche() {
        const selectInsert = document.getElementById('banca');
        const selectFilter = document.getElementById('filtro-banca');
        const currentFilter = selectFilter.value;
        
        selectInsert.innerHTML = '';
        selectFilter.innerHTML = '<option value="TUTTE">TUTTE LE BANCHE INSIEME</option>';
        
        banks.forEach(b => {
            selectInsert.innerHTML += `<option value="${b}">${b}</option>`;
            selectFilter.innerHTML += `<option value="${b}">Solo ${b.toUpperCase()}</option>`;
        });
        
        if (banks.includes(currentFilter) || currentFilter === "TUTTE") {
            selectFilter.value = currentFilter;
        }
    }

    function aggiungiBanca() {
        const nuova = prompt("Inserisci il nome della nuova Banca:");
        if (nuova && nuova.trim() !== "") {
            banks.push(nuova.trim());
            localStorage.setItem('assegni_banks', JSON.stringify(banks));
            aggiornaSelectBanche();
            renderScadenziario();
        }
    }

    document.getElementById('checkForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const check = {
            id: Date.now().toString(),
            data: document.getElementById('data').value,
            importo: parseFloat(document.getElementById('importo').value),
            banca: document.getElementById('banca').value,
            numero: document.getElementById('numeroAssegno').value,
            beneficiario: document.getElementById('beneficiario').value,
            causale: document.getElementById('causale').value,
            pagato: false
        };
        checks.push(check);
        saveAndRender();
        this.reset();
    });

    window.aggiornaCampo = function(id, campo, valore) {
        const check = checks.find(c => c.id === id);
        if (check) {
            if (campo === 'importo') {
                let numeroPulito = valore.replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
                check.importo = parseFloat(numeroPulito) || 0;
            } else {
                check[campo] = valore;
            }
            saveAndRender();
        }
    };

    window.togglePagato = function(id, isChecked) {
        const check = checks.find(c => c.id === id);
        if (check) {
            check.pagato = isChecked;
            saveAndRender();
        }
    };

    function eliminaAssegno(id) {
        if(confirm("Vuoi eliminare questo assegno?")) {
            checks = checks.filter(c => c.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('assegni_data', JSON.stringify(checks));
        aggiornaListaBeneficiari(); 
        renderScadenziario();
    }

    function calcolaRiepiloghi(datiFiltrati) {
        const container = document.getElementById('riepilogo-contabile');
        if (datiFiltrati.length === 0) {
            container.innerHTML = '<p>Nessun dato corrispondente al filtro.</p>';
            return;
        }

        const totalsByMonth = {};
        const totalsByYear = {};

        datiFiltrati.forEach(c => {
            const date = new Date(c.data);
            const year = date.getFullYear();
            const monthStr = getMonthYearStr(c.data);
            
            if (!totalsByMonth[monthStr]) totalsByMonth[monthStr] = { emesso: 0, pagato: 0, residuo: 0, dateObj: date };
            if (!totalsByYear[year]) totalsByYear[year] = { emesso: 0, pagato: 0, residuo: 0 };

            totalsByMonth[monthStr].emesso += c.importo;
            totalsByYear[year].emesso += c.importo;

            if (c.pagato) {
                totalsByMonth[monthStr].pagato += c.importo;
                totalsByYear[year].pagato += c.importo;
            } else {
                totalsByMonth[monthStr].residuo += c.importo;
                totalsByYear[year].residuo += c.importo;
            }
        });

        let htmlMensile = `
            <h3>Situazione Mensile</h3>
            <table class="summary-table">
                <thead>
                    <tr><th>Mese</th><th class="col-emesso">Totale Emesso</th><th class="col-pagato">Già Pagato</th><th class="col-residuo">DA PAGARE (Residuo)</th></tr>
                </thead>
                <tbody>`;
        
        const sortedMonths = Object.keys(totalsByMonth).sort((a, b) => totalsByMonth[a].dateObj - totalsByMonth[b].dateObj);
        sortedMonths.forEach(month => {
            htmlMensile += `<tr><td>${month}</td><td class="col-emesso">${formatCurrency(totalsByMonth[month].emesso)}</td><td class="col-pagato">${formatCurrency(totalsByMonth[month].pagato)}</td><td class="col-residuo">${formatCurrency(totalsByMonth[month].residuo)}</td></tr>`;
        });
        htmlMensile += `</tbody></table>`;

        let htmlAnnuale = `
            <h3>Situazione Annuale</h3>
            <table class="summary-table">
                <thead><tr><th>Anno</th><th class="col-emesso">Totale Emesso</th><th class="col-pagato">Già Pagato</th><th class="col-residuo">DA PAGARE (Residuo)</th></tr></thead>
                <tbody>`;
                
        Object.keys(totalsByYear).sort().forEach(year => {
            htmlAnnuale += `<tr><td>${year}</td><td class="col-emesso">${formatCurrency(totalsByYear[year].emesso)}</td><td class="col-pagato">${formatCurrency(totalsByYear[year].pagato)}</td><td class="col-residuo">${formatCurrency(totalsByYear[year].residuo)}</td></tr>`;
        });
        htmlAnnuale += `</tbody></table>`;

        container.innerHTML = htmlMensile + htmlAnnuale;
    }

    // =========================================================================
    // MOTORE PDF SICURO: Usa le classi CSS per mostrare i testi puri senza input
    // =========================================================================
    function scaricaPDFPuro() {
        const container = document.getElementById('main-container');
        
        // Applica la classe per forzare la vista "PDF" (rimuove input, espande testo)
        container.classList.add('export-mode');
        
        // Titolo dinamico in base al filtro
        const filtro = document.getElementById('filtro-banca').value;
        document.getElementById('pdf-header-title').innerText = "Contabilità Assegni - " + filtro;

        const opt = {
            margin:       [10, 10, 10, 10], // Margini uniformi
            filename:     'contabilita-assegni.pdf',
            image:        { type: 'jpeg', quality: 1 },
            html2canvas:  { scale: 2, useCORS: true, windowWidth: 1100 }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };
        
        html2pdf().set(opt).from(container).save().then(() => {
            // Rimuove la classe PDF e ripristina la visualizzazione a schermo
            container.classList.remove('export-mode');
        });
    }

    function renderScadenziario() {
        const filtro = document.getElementById('filtro-banca').value;
        let checksToRender = checks;
        if (filtro !== "TUTTE") {
            checksToRender = checks.filter(c => c.banca === filtro);
        }

        calcolaRiepiloghi(checksToRender); 

        const containerDaPagare = document.getElementById('scadenziario-da-pagare');
        const containerPagati = document.getElementById('scadenziario-pagati');
        const sezionePagati = document.getElementById('sezione-pagati');
        
        containerDaPagare.innerHTML = '';
        containerPagati.innerHTML = '';

        if (checksToRender.length === 0) {
            containerDaPagare.innerHTML = '<p style="text-align:center; padding: 20px; font-weight:bold;">Nessun assegno trovato per questa selezione.</p>';
            sezionePagati.style.display = 'none';
            return;
        }

        checksToRender.sort((a, b) => new Date(a.data) - new Date(b.data));

        const daPagare = checksToRender.filter(c => !c.pagato);
        const pagati = checksToRender.filter(c => c.pagato);

        renderTableGroup(daPagare, containerDaPagare, false);
        
        if (pagati.length > 0) {
            sezionePagati.style.display = 'block';
            renderTableGroup(pagati, containerPagati, true);
        } else {
            sezionePagati.style.display = 'none';
        }
    }

    function renderTableGroup(datiAssegni, containerDOM, isPagato) {
        if (datiAssegni.length === 0) {
            if(!isPagato) containerDOM.innerHTML = '<p style="text-align:center; color:#7f8c8d; padding:20px; font-weight:bold;">Tutti gli assegni del periodo sono stati pagati.</p>';
            return;
        }

        const grouped = {};
        datiAssegni.forEach(c => {
            const my = getMonthYearStr(c.data);
            if (!grouped[my]) grouped[my] = [];
            grouped[my].push(c);
        });

        const rowClass = isPagato ? 'row-pagato' : '';
        const headerClass = isPagato ? 'header-pagati' : '';
        const totalRowClass = isPagato ? 'total-row-pagati' : '';

        for (const [month, items] of Object.entries(grouped)) {
            let html = `
            <div class="month-group">
                <div class="month-header ${headerClass}">${month}</div>
                <div style="overflow-x: auto;">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th class="col-data">Data</th>
                                <th class="col-banca">Banca</th>
                                <th class="col-numero">N° Assegno</th>
                                <th class="col-benef">Beneficiario</th>
                                <th class="col-causale">Causale</th>
                                <th class="col-importo">Importo</th>
                                <th class="col-azione no-print">Stato</th>
                            </tr>
                        </thead>
                        <tbody>`;

            let totaleMese = 0;
            
            items.forEach(c => {
                totaleMese += c.importo;
                
                let rowSelectHtml = `<select class="edit-input no-print" onchange="aggiornaCampo('${c.id}', 'banca', this.value)">`;
                banks.forEach(b => { rowSelectHtml += `<option value="${b}" ${c.banca === b ? 'selected' : ''}>${b}</option>`; });
                rowSelectHtml += `</select>`;

                html += `
                            <tr class="${rowClass}">
                                <td class="col-data">
                                    <input type="date" class="edit-input date-input no-print" value="${c.data}" onchange="aggiornaCampo('${c.id}', 'data', this.value)">
                                    <span class="print-only">${formatDate(c.data)}</span>
                                </td>
                                <td class="col-banca">
                                    ${rowSelectHtml}
                                    <span class="print-only">${c.banca}</span>
                                </td>
                                <td class="col-numero">
                                    <input type="text" class="edit-input no-print" value="${c.numero}" onchange="aggiornaCampo('${c.id}', 'numero', this.value)">
                                    <span class="print-only">${c.numero}</span>
                                </td>
                                <td class="col-benef">
                                    <input type="text" class="edit-input no-print" list="lista-beneficiari" value="${c.beneficiario}" onchange="aggiornaCampo('${c.id}', 'beneficiario', this.value)">
                                    <span class="print-only">${c.beneficiario}</span>
                                </td>
                                <td class="col-causale">
                                    <input type="text" class="edit-input causale-text no-print" value="${c.causale || ''}" title="${c.causale || ''}" onchange="aggiornaCampo('${c.id}', 'causale', this.value)">
                                    <span class="print-only causale-text">${c.causale || ''}</span>
                                </td>
                                <td class="col-importo">
                                    <input type="text" class="edit-input edit-amount no-print" value="${formatCurrency(c.importo)}" onchange="aggiornaCampo('${c.id}', 'importo', this.value)">
                                    <span class="print-only edit-amount">${formatCurrency(c.importo)}</span>
                                </td>
                                <td class="col-azione no-print">
                                    <div class="action-cell">
                                        <label class="cb-label">
                                            <input type="checkbox" onchange="togglePagato('${c.id}', this.checked)" ${c.pagato ? 'checked' : ''}> Pagato
                                        </label>
                                        <button class="delete-btn" onclick="eliminaAssegno('${c.id}')">Elimina</button>
                                    </div>
                                </td>
                            </tr>`;
            });

            html += `
                        </tbody>
                        <tfoot>
                            <tr class="total-row ${totalRowClass}">
                                <td colspan="5">Totale ${isPagato ? 'Pagato' : 'DA PAGARE'} ${month}:</td>
                                <td colspan="2">${formatCurrency(totaleMese)}</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>`;
            
            containerDOM.innerHTML += html;
        }
    }

    init();
</script>
